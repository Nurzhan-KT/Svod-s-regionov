<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Учёт транспортировки ТМЗ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#003087;--blue:#0055AB;--blue2:#0078D7;--pale:#EBF3FC;
  --green:#1A6B2E;--green-bg:#E6F4EA;
  --red:#B91C1C;--red-bg:#FEE2E2;
  --amber:#92400E;--amber-bg:#FEF3C7;
  --bg:#F0F4F9;--border:#D0D7DE;--text:#1F2328;--muted:#636C76;
  --sh:0 1px 4px rgba(0,0,0,.08);--sh2:0 4px 16px rgba(0,0,0,.12);
  --r:10px;--r2:6px;
}
html{font-size:14px}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* LOGIN */
#loginModal{position:fixed;inset:0;background:rgba(0,20,60,.78);display:flex;align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(6px)}
.mbox{background:#fff;border-radius:20px;padding:36px 32px;width:min(420px,92vw);box-shadow:var(--sh2);text-align:center}
.mlogo{width:62px;height:62px;background:linear-gradient(145deg,var(--navy),var(--blue2));border-radius:15px;display:inline-flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff;margin-bottom:10px}
.mco{font-size:11px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:16px}
.mtitle{font-size:19px;font-weight:700;color:var(--navy);margin-bottom:4px}
.msub{color:var(--muted);font-size:12px;margin-bottom:20px;line-height:1.5}
.mf{margin-bottom:12px;text-align:left}
.mf label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.mf input,.mf select{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--r2);font-size:13.5px;font-family:inherit}
.btn-login{width:100%;padding:12px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border:none;border-radius:var(--r2);font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;font-family:inherit}
.btn-login:hover{opacity:.9}

/* HEADER */
.hdr{background:linear-gradient(135deg,var(--navy),var(--blue2));color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;height:54px;position:sticky;top:0;z-index:200;box-shadow:0 2px 10px rgba(0,30,80,.3)}
.hl{display:flex;align-items:center;gap:11px}
.hicon{width:32px;height:32px;background:rgba(255,255,255,.18);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px}
.hco{font-size:14px;font-weight:700}.hsub{font-size:10px;opacity:.75}
.hr{display:flex;align-items:center;gap:12px;font-size:13px}
.uchip{background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.28);border-radius:20px;padding:4px 12px;display:flex;align-items:center;gap:6px}
.udot{width:7px;height:7px;background:#4ADE80;border-radius:50%}
.btn-exit{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);color:#fff;padding:4px 12px;border-radius:var(--r2);cursor:pointer;font-size:12px;font-family:inherit}

/* TABS */
.tabbar{background:#fff;border-bottom:2px solid var(--border);padding:0 22px;display:flex;gap:2px;position:fixed;top:54px;left:0;right:0;z-index:150;box-shadow:0 2px 5px rgba(0,0,0,.06);overflow-x:auto}
.tabbtn{display:flex;align-items:center;gap:8px;padding:11px 20px;background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);transition:all .15s;font-family:inherit;white-space:nowrap}
.tabbtn:hover{color:var(--navy);background:var(--pale)}
.tabbtn.active{color:var(--navy);border-bottom-color:var(--navy);font-weight:700}

/* LAYOUT */
.content{max-width:1500px;margin:0 auto;padding:18px 22px;padding-top:70px}
.sec{display:none}.sec.active{display:block}

/* CARDS */
.card{background:#fff;border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.cardhd{padding:12px 18px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cardhd-l{display:flex;align-items:center;gap:8px}
.cardbody{padding:16px 18px}

/* FORM GRID */
.frow{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px}
.frow.sep{border-top:1px solid var(--border);padding-top:10px;margin-top:2px}
.ff{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
.ff.w2{flex:2;min-width:200px}
.ff.w3{flex:3;min-width:260px}
.ff.w05{flex:0.5;min-width:90px}
.ff label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.ff label .req{color:var(--red)}
.ff input,.ff select,.ff textarea{padding:7px 10px;border:1.5px solid var(--border);border-radius:var(--r2);font-size:13px;color:var(--text);font-family:inherit;background:#fff;transition:border-color .15s}
.ff input:focus,.ff select:focus,.ff textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,85,171,.1)}
.ff input[readonly]{background:#f8f9fa;color:var(--muted);cursor:default}
.ff.auto-field input{background:#f0f7ff;color:var(--navy);font-weight:600}
input[type=date]{cursor:pointer}
.delay-pos{color:var(--green);font-weight:700}
.delay-neg{color:var(--red);font-weight:700}

/* AUTOCOMPLETE */
.ac-wrap{position:relative}
.ac-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid var(--blue);border-top:none;border-radius:0 0 var(--r2) var(--r2);max-height:220px;overflow-y:auto;z-index:500;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.ac-item{padding:7px 11px;cursor:pointer;font-size:13px;border-bottom:1px solid #f0f2f5}
.ac-item:hover,.ac-item.selected{background:var(--pale);color:var(--navy)}
.ac-item mark{background:#fff3cd;border-radius:2px;padding:0 1px}
.ac-empty{padding:10px 11px;color:var(--muted);font-size:12px;font-style:italic}

/* MATERIALS TABLE */
.mtbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:10px}
.mtbl th{background:#f0f4f9;padding:7px 9px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;text-align:left;border-bottom:2px solid var(--border);white-space:nowrap}
.mtbl td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.mtbl tr:hover td{background:#fafbfd}
.mtbl input,.mtbl select{width:100%;padding:5px 7px;border:1.5px solid var(--border);border-radius:4px;font-size:12.5px;font-family:inherit;background:#fff}
.mtbl input:focus,.mtbl select:focus{outline:none;border-color:var(--blue)}
.mtbl input[readonly]{background:#f0f7ff;color:var(--navy);font-weight:600}
.mtbl .ac-list{font-size:12.5px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 17px;border:none;border-radius:var(--r2);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:#002070}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#145422}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:#991B1B}
.btn-outline{background:transparent;border:1.5px solid var(--navy);color:var(--navy)}.btn-outline:hover{background:var(--pale)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-ghost{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff}.btn-ghost:hover{background:rgba(255,255,255,.24)}
.btns{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:4px}
.btn-add-row{background:#e8f4ff;border:1.5px dashed var(--blue2);color:var(--blue);padding:5px 12px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit}
.btn-add-row:hover{background:var(--pale)}
.btn-del-row{background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.btn-del-row:hover{background:var(--red-bg);border-radius:4px}

/* SUMMARY TABLE */
.twrap{overflow-x:auto;border-radius:var(--r2)}
table.dt{width:100%;border-collapse:collapse;font-size:12px;min-width:1400px}
.dt thead{background:var(--navy);color:#fff}
.dt thead th{padding:8px 10px;text-align:left;font-weight:600;white-space:nowrap;font-size:11px}
.dt tbody tr{border-bottom:1px solid var(--border)}
.dt tbody tr:hover{background:#fafbff}
.dt tbody td{padding:7px 10px;vertical-align:middle}
.et{text-align:center;padding:30px;color:var(--muted)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-ok{background:var(--green-bg);color:var(--green);border:1px solid #B7DFBE}
.badge-wait{background:var(--amber-bg);color:var(--amber);border:1px solid #FDE68A}
.badge-go{background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE}
.badge-del{background:#F5F3FF;color:#5B21B6;border:1px solid #DDD6FE}
.cntbadge{background:rgba(255,255,255,.2);padding:1px 8px;border-radius:10px;font-size:11.5px;margin-left:5px}
.cntbubble{background:rgba(0,0,0,.15);padding:1px 7px;border-radius:10px;font-size:11px;font-weight:700}

/* STATUS PANEL */
.sthdr{background:#fff;border-radius:var(--r);padding:14px 18px;margin-bottom:14px;border:1px solid var(--border);box-shadow:var(--sh)}
.strow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.sttitle{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.stgrid{display:flex;flex-wrap:wrap;gap:7px}
.stdot{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:7px;font-size:12.5px;font-weight:500}
.stdot.filled{background:var(--green-bg);color:var(--green);border:1px solid #B7DFBE}
.stdot.empty{background:var(--red-bg);color:var(--red);border:1px solid #FECACA}

/* TOAST */
#toast{position:fixed;top:62px;right:18px;padding:10px 18px;border-radius:9px;font-size:13px;font-weight:500;color:#fff;box-shadow:var(--sh2);z-index:9998;transform:translateX(calc(100% + 30px));transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
#toast.show{transform:translateX(0)}
#toast.t-ok{background:var(--green)}
#toast.t-err{background:var(--red)}
#toast.t-info{background:var(--navy)}

/* SUMMARY TABLE */
.stbl{width:100%;border-collapse:collapse;font-size:13px}
.stbl th{background:var(--navy);color:#fff;padding:8px 12px;text-align:right;font-size:11.5px;white-space:nowrap;font-weight:600}
.stbl th:first-child{text-align:left;min-width:180px}
.stbl td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:right;vertical-align:middle}
.stbl td:first-child{text-align:left;font-weight:500;white-space:nowrap}
.stbl tr:hover td{filter:brightness(.96)}
.sr-ok{background:#f0fdf4}.sr-go{background:#eff6ff}.sr-wait{background:#fffbeb}
.sr-grand td{background:#e5ecf8;font-weight:700;border-top:2px solid var(--navy)}
.sv{display:block;font-weight:700}.sc{font-size:10.5px;color:var(--muted)}
.scol-tot{background:#eef2fb!important;font-weight:700}

/* MISC */
.section-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--blue);margin-bottom:6px;padding-bottom:4px;border-bottom:2px solid #dbeafe}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#bbb;border-radius:3px}
@media(max-width:768px){.content{padding:14px}.frow{flex-direction:column}}

/* EDIT MODAL */
#editModal{position:fixed;inset:0;background:rgba(0,20,60,.78);display:none;align-items:flex-start;justify-content:center;z-index:8000;backdrop-filter:blur(5px);padding:20px 14px;overflow-y:auto}
#editModal.open{display:flex}
.ebox{background:#fff;border-radius:var(--r);width:min(1120px,96vw);box-shadow:var(--sh2);margin:auto}
.ehdr{background:linear-gradient(135deg,var(--navy),var(--blue2));color:#fff;padding:13px 18px;border-radius:var(--r) var(--r) 0 0;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;position:sticky;top:0;z-index:1}
.ebody{padding:18px;max-height:calc(100vh - 160px);overflow-y:auto}
.eftr{padding:12px 18px;background:#f8f9fa;border-top:1px solid var(--border);border-radius:0 0 var(--r) var(--r);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0}
.eclose{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.4);color:#fff;width:27px;height:27px;border-radius:50%;cursor:pointer;font-size:15px;line-height:1;font-family:inherit;display:flex;align-items:center;justify-content:center}
.eclose:hover{background:rgba(255,255,255,.3)}
.act-btns{display:flex;gap:5px;white-space:nowrap}
.btn-edit{background:#EFF6FF;border:1.5px solid #BFDBFE;color:#1D4ED8;padding:4px 10px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-edit:hover{background:#DBEAFE}
.btn-del{background:#FEF2F2;border:1.5px solid #FECACA;color:var(--red);padding:4px 10px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-del:hover{background:var(--red-bg)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginModal">
  <div class="mbox">
    <div class="mlogo">КТ</div>
    <div class="mco">АО «Казахтелеком»</div>
    <h2 class="mtitle">Учёт транспортировки ТМЗ</h2>
    <p class="msub">Войдите для внесения и просмотра данных</p>
    <div class="mf"><label>ФИО</label><input id="lFio" placeholder="Фамилия Имя Отчество"/></div>
    <div class="mf">
      <label>Роль</label>
      <select id="lRole">
        <option value="">— Выберите роль —</option>
        <option value="user">Пользователь</option>
        <option value="admin" id="optAdmin" style="display:none">Администратор</option>
      </select>
    </div>
    <div class="mf">
      <label>Пароль администратора</label>
      <input id="lPass" type="password" placeholder="Для роли Администратор"/>
    </div>
    <button class="btn-login" onclick="doLogin()">Войти</button>
  </div>
</div>

<!-- HEADER -->
<header class="hdr" id="appHdr" style="display:none">
  <div class="hl">
    <div class="hicon">КТ</div>
    <div><div class="hco">АО «Казахтелеком»</div><div class="hsub">Учёт транспортировки ТМЗ</div></div>
  </div>
  <div class="hr">
    <div class="uchip"><div class="udot"></div><span id="hName">—</span></div>
    <button class="btn-exit" onclick="doLogout()">Выйти</button>
  </div>
</header>

<!-- TABS -->
<nav class="tabbar" id="tabbar" style="display:none">
  <button class="tabbtn active" id="tabKab" onclick="switchTab('Kab')"><span>🔌</span><span>Кабельная продукция</span></button>
  <button class="tabbtn" id="tabCli" onclick="switchTab('Cli')"><span>📡</span><span>Клиентское оборудование</span></button>
  <button class="tabbtn" id="tabSta" onclick="switchTab('Sta')"><span>🏭</span><span>Станционное оборудование</span></button>
  <button class="tabbtn" id="tabPrc" onclick="switchTab('Prc')"><span>📦</span><span>Прочее</span></button>
</nav>

<main class="content" id="mainContent" style="display:none">
  <section class="sec active" id="secKab"></section>
  <section class="sec" id="secCli"></section>
  <section class="sec" id="secSta"></section>
  <section class="sec" id="secPrc"></section>
</main>
<div id="toast"></div>

<!-- EDIT MODAL -->
<div id="editModal">
  <div class="ebox">
    <div class="ehdr">
      <span>✏️ Корректировка — <span id="eTabLabel"></span></span>
      <button class="eclose" onclick="closeEditModal()">✕</button>
    </div>
    <div class="ebody">
      <div class="section-label">📋 Реквизиты заявки</div>
      <div class="frow">
        <div class="ff w05"><label>№ Заявки</label><input id="eReqNum" placeholder="001"/></div>
        <div class="ff"><label>Дата заявки</label><input type="date" id="eDate"/></div>
        <div class="ff"><label>Вид транспорта</label><select id="eTransport"></select></div>
        <div class="ff w2"><label>Перевозчик</label><input id="eCarrier" placeholder="Наименование перевозчика"/></div>
        <div class="ff"><label>Финансирование</label><select id="eFinance"></select></div>
        <div class="ff w2"><label>Ответственный</label><input id="eResp" placeholder="ФИО"/></div>
      </div>
      <div class="section-label frow sep">🚚 Маршрут</div>
      <div class="frow">
        <div class="ff"><label>Регион-отправитель</label>
          <select id="eRegFrom" onchange="onEditRegChange('From')"></select></div>
        <div class="ff"><label>Склад-отправитель</label>
          <select id="eWhFrom"><option value="">—</option></select></div>
        <div class="ff"><label>Регион-получатель</label>
          <select id="eRegTo" onchange="onEditRegChange('To')"></select></div>
        <div class="ff auto-field"><label>РДТ (авто)</label><input id="eRDT" readonly placeholder="—"/></div>
        <div class="ff"><label>Склад-получатель</label>
          <select id="eWhTo"><option value="">—</option></select></div>
      </div>
      <div class="section-label frow sep">📅 Сроки и статус</div>
      <div class="frow">
        <div class="ff"><label>План отгрузки</label><input type="date" id="ePlanShip"/></div>
        <div class="ff"><label>Факт отгрузки</label><input type="date" id="eFactShip"/></div>
        <div class="ff"><label>План доставки</label><input type="date" id="ePlanDel" onchange="calcEditDelay()"/></div>
        <div class="ff"><label>Факт доставки</label><input type="date" id="eFactDel" onchange="calcEditDelay()"/></div>
        <div class="ff"><label>Статус</label><select id="eStatus"></select></div>
        <div class="ff auto-field w05"><label>Просрочка, дн.</label><input id="eDelay" readonly placeholder="—"/></div>
      </div>
      <div class="section-label frow sep">📦 Материалы</div>
      <div style="overflow-x:auto;margin-bottom:8px">
        <table class="mtbl">
          <thead><tr>
            <th style="min-width:280px">Наименование</th>
            <th style="min-width:110px">SAP-код</th>
            <th style="min-width:90px">Кол-во</th>
            <th style="min-width:80px">Ед.</th>
            <th style="min-width:110px">Стоимость, тг</th>
            <th style="min-width:90px">Вес, кг</th>
            <th></th>
          </tr></thead>
          <tbody id="eMatBody"></tbody>
        </table>
      </div>
      <button class="btn-add-row" onclick="addEditMatRow()">+ Добавить строку материала</button>
      <div class="frow" style="margin-top:12px">
        <div class="ff w3"><label>Комментарий</label><input id="eComment" placeholder="Дополнительная информация..."/></div>
      </div>
    </div>
    <div class="eftr">
      <button class="btn btn-navy" onclick="saveEditModal()">💾 Сохранить изменения</button>
      <button class="btn btn-outline" onclick="closeEditModal()">Отмена</button>
    </div>
  </div>
</div>

<script>
// ── FIREBASE ──
const firebaseConfig = {
  apiKey: "AIzaSyDAf57D5gqcoVQJTVhygWL8CZZfVjMAC6Q",
  authDomain: "svod-s-regionov.firebaseapp.com",
  projectId: "svod-s-regionov",
  storageBucket: "svod-s-regionov.firebasestorage.app",
  messagingSenderId: "883313324410",
  appId: "1:883313324410:web:a5854026fefe3e6055a6c3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ── REFERENCE DATA ──
const REGION_DATA = {
  'Алматы':         {rdt:'АЛМАТЫ', wh:['30ZA','25DA','33DА']},
  'Астана':         {rdt:'АСТАНА', wh:['30AA','25АА']},
  'Шымкент':        {rdt:'ЮГ',     wh:['25NA']},
  'Тараз':          {rdt:'ЮГ',     wh:['25PA','33PA']},

// ── AUTOCOMPLETE ──
const activeAC = {};
function makeAC(inputEl, matsArr, sapEl, unitEl){
  let idx = -1;
  const container = inputEl.closest('.ac-wrap') || inputEl.parentElement;
  let list = container.querySelector('.ac-list');
  if(!list){list = document.createElement('div');list.className='ac-list';list.style.display='none';container.appendChild(list);}

  function show(items){
    if(!items.length){list.innerHTML='<div class="ac-empty">Ничего не найдено</div>';}
    else{
      list.innerHTML = items.slice(0,20).map((m,i)=>{
        const q = inputEl.value.trim().toLowerCase();
        const hi = m.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
        return `<div class="ac-item" data-val="${m}" data-i="${i}">${hi}</div>`;
      }).join('');
    }
    list.style.display = '';
    list.querySelectorAll('.ac-item').forEach(el=>{
      el.onmousedown = e=>{e.preventDefault(); select(el.dataset.val);};
    });
    idx = -1;
  }
  function hide(){list.style.display='none'; idx=-1;}
  function select(val){
    inputEl.value = val;
    const m = matsArr.find(x=>x===val);
    const mData = m ? getMatData(m) : null;
    if(sapEl && mData) sapEl.value = mData.sap||'';
    if(unitEl && mData) unitEl.value = mData.unit||'';
    hide();
  }
  function getMatData(name){
    for(const tab of TABS){ if(tab.mats[name]) return tab.mats[name]; }
    return null;
  }

  inputEl.addEventListener('input', ()=>{
    const q = inputEl.value.trim().toLowerCase();
    if(!q){hide();return;}
    const hits = matsArr.filter(m=>m.toLowerCase().includes(q));
    show(hits);
  });
  inputEl.addEventListener('keydown', e=>{
    const items = list.querySelectorAll('.ac-item');
    if(e.key==='ArrowDown'){e.preventDefault();idx=Math.min(idx+1,items.length-1);}
    else if(e.key==='ArrowUp'){e.preventDefault();idx=Math.max(idx-1,0);}
    else if(e.key==='Enter'&&idx>=0){e.preventDefault();select(items[idx].dataset.val);}
    else if(e.key==='Escape'){hide();}
    items.forEach((el,i)=>el.classList.toggle('selected',i===idx));
  });
  inputEl.addEventListener('blur', ()=>setTimeout(hide,150));
  inputEl.addEventListener('focus', ()=>{
    if(inputEl.value.trim()) inputEl.dispatchEvent(new Event('input'));
  });
}

function calcDelay(p){
  const plan = document.getElementById(p+'PlanDel').value;
  const fact = document.getElementById(p+'FactDel').value;
  const el   = document.getElementById(p+'Delay');
  if(plan && fact){
    const days = Math.round((new Date(fact)-new Date(plan))/(1000*60*60*24));
    el.value = days > 0 ? '+'+days : days;
    el.className = days > 0 ? 'delay-neg' : 'delay-pos';
    el.style.color = days > 0 ? 'var(--red)' : 'var(--green)';
  } else {
    el.value = '';
    el.style.color = '';
  }
}

function statusBadge(s){
  const cls = s==='Доставлен'?'badge-ok':s==='в пути'?'badge-go':s==='Ждут транзитной авто'?'badge-wait':'badge-del';
  return `<span class="badge ${cls}">${s||'—'}</span>`;
}
function fmtDate(d){if(!d)return'—';const [y,m,dd]=d.split('-');return`${dd}.${m}.${y}`;}
function fmtNum(n){if(!n&&n!==0)return'—';return Number(n).toLocaleString('ru');}

// ── SUMMARY ──
const RDTS_ORDER = ['АЛМАТЫ','АСТАНА','ВОСТОК','ЗАПАД','СЕВЕР','ЦЕНТР','ЮГ'];
const STATUS_ORDER = ['Доставлен','в пути','Ждут транзитной авто'];

function renderSummary(p){
  const hdrEl  = document.getElementById('sumHdr'+p);
  const bodyEl = document.getElementById('sumBody'+p);
  if(!hdrEl||!bodyEl) return;

  const data   = tabData[p]||[];
  const metric = document.getElementById('sumGroupBy'+p)?.value||'qty';

  if(!data.length){
    hdrEl.innerHTML  = '<th>Статус</th><th>Итого</th>';
    bodyEl.innerHTML = '<tr><td colspan="2" style="text-align:center;padding:24px;color:var(--muted)">Нет данных</td></tr>';
    return;
  }

  // Collect active RDTs sorted by canonical order
  const activeCols = [...new Set(data.map(r=>r.rdt||'—').filter(v=>v!=='—'))]
    .sort((a,b)=>{
      const ia=RDTS_ORDER.indexOf(a), ib=RDTS_ORDER.indexOf(b);
      return (ia<0?99:ia)-(ib<0?99:ib);
    });

  // Build pivot
  const pivot = {};      // status -> col -> value
  const colTot = {};     // col -> total
  const rowTot = {};     // status -> total
  let grandTotal = 0;

  data.forEach(r=>{
    const s   = r.status||'—';
    const col = r.rdt||'—';
    const qty = (r.materials||[]).reduce((acc,m)=>acc+Number(m.qty||0),0);
    const cost= (r.materials||[]).reduce((acc,m)=>acc+Number(m.cost||0),0);
    const val = metric==='cnt'?1 : metric==='cost'?cost : qty;

    if(!pivot[s]) pivot[s]={};
    pivot[s][col] = (pivot[s][col]||0) + val;
    colTot[col]   = (colTot[col]||0) + val;
    rowTot[s]     = (rowTot[s]||0) + val;
    grandTotal   += val;
  });

  const allStatuses = [
    ...STATUS_ORDER.filter(s=>pivot[s]),
    ...Object.keys(pivot).filter(s=>!STATUS_ORDER.includes(s))
  ];

  const unit = metric==='cost'?' тг':metric==='cnt'?' зак.':'';
  function fv(n){ if(!n) return '<span style="color:#ccc">—</span>'; return Number(n).toLocaleString('ru')+unit; }

  function rowCls(s){
    if(s==='Доставлен') return 'sr-ok';
    if(s==='в пути')    return 'sr-go';
    if(s==='Ждут транзитной авто') return 'sr-wait';
    return '';
  }

  // Header
  hdrEl.innerHTML = '<th>Статус</th>'
    + activeCols.map(c=>`<th>${c}</th>`).join('')
    + '<th class="scol-tot">Итого</th>';

  // Rows
  let html = allStatuses.map(s=>`
    <tr class="${rowCls(s)}">
      <td>${s==='—'?'<i style="color:var(--muted)">Без статуса</i>':s}</td>
      ${activeCols.map(c=>`<td>${fv(pivot[s][c])}</td>`).join('')}
      <td class="scol-tot"><strong>${fv(rowTot[s])}</strong></td>
    </tr>`).join('');

  // Grand total row
  html += `<tr class="sr-grand">
    <td><strong>Итого</strong></td>
    ${activeCols.map(c=>`<td><strong>${fv(colTot[c])}</strong></td>`).join('')}
    <td class="scol-tot"><strong>${fv(grandTotal)}</strong></td>
  </tr>`;

  bodyEl.innerHTML = html;
}
